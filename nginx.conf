# nginx.conf - Simplified
server {
    listen 5000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Only handle frontend routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Handle Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
    }
}