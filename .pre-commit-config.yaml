repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        files: "\\.(ts|tsx|js|jsx|json|md|css|scss|html)$"
        additional_dependencies: ["prettier@3.0.0"]

  - repo: local
    hooks:
      - id: eslint-ts
        name: eslint on TypeScript
        entry: npx eslint .
        language: system
        types: [ts, tsx]
        pass_filenames: false
