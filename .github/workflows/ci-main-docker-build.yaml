name: Main -- Build Docker Image and push to ECR

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  DEFAULT_IMAGE_TAG: "latest"
  IMAGE_NAME: bh-ui
  CURRENT_APP_VER: ${{ vars.APP_VER }}
  REPOSITORY: "058264070106.dkr.ecr.us-east-1.amazonaws.com"
  PR_GAR_URL: "058264070106.dkr.ecr.us-east-1.amazonaws.com"
  MAIN_GAR_URL: "058264070106.dkr.ecr.us-east-1.amazonaws.com"
  AWS_REGION: "us-east-1"

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: [self-hosted, bh]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | \
          docker login --username AWS --password-stdin "${REPOSITORY}"
      
      - name: Export AWS Credentials
        run: |
          echo "Exporting AWS credentials"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Configure npm for AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain bighammer \
            --domain-owner 058264070106 \
            --query authorizationToken \
            --output text)
    
          echo "registry=https://bighammer-058264070106.d.codeartifact.us-east-1.amazonaws.com/npm/bh-npm-repo/" > .npmrc
          echo "//bighammer-058264070106.d.codeartifact.us-east-1.amazonaws.com/npm/bh-npm-repo/:always-auth=true" >> .npmrc
          echo "//bighammer-058264070106.d.codeartifact.us-east-1.amazonaws.com/npm/bh-npm-repo/:_authToken=${TOKEN}" >> .npmrc
          echo "AWS CodeArtifact configured successfully"
          
      - name: Extract Branch Name
        run: |
          echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Set IMAGE_TAG for PR
        if: github.event_name == 'pull_request'
        run: |
          echo "IMAGE_TAG=${{ env.CURRENT_APP_VER }}-${{ github.run_number }}-PR.${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Build Docker Image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker build --no-cache -t "${PR_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Push Docker Image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker push "${PR_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Set IMAGE_TAG for Main Branch
        if: github.event_name == 'push'
        run: |
          echo "IMAGE_TAG=${{ env.CURRENT_APP_VER }}-${{ github.run_number }}-rc" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_ENV

      - name: Build Docker Image for Main Branch
        if: github.event_name == 'push'
        run: |
          docker build --no-cache \
            -t "${MAIN_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${MAIN_GAR_URL}/${IMAGE_NAME}:${DEFAULT_IMAGE_TAG}" \
            -t "${MAIN_GAR_URL}/${IMAGE_NAME}:${GIT_HASH}" .

      - name: Push Docker Image for Main Branch
        if: github.event_name == 'push'
        run: |
          docker push "${MAIN_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${MAIN_GAR_URL}/${IMAGE_NAME}:${DEFAULT_IMAGE_TAG}"
          docker push "${MAIN_GAR_URL}/${IMAGE_NAME}:${GIT_HASH}"

      
      # PR Build Success Notification
      - name: MS Teams Notification (PR Success)
        if: github.event_name == 'pull_request' && success()
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ secrets.COMMON_GITHUB_TOKEN }}
          ms-teams-webhook-uri: ${{ secrets.BH_CI_PIPELINE_ALERTS }}
          notification-summary: |
            PR -- Successfully built and pushed Docker image: `${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}`
            [View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          notification-color: 00FF00

      # PR Build Failure Notification
      - name: MS Teams Notification (PR Failure)
        if: github.event_name == 'pull_request' && failure()
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ secrets.COMMON_GITHUB_TOKEN }}
          ms-teams-webhook-uri: ${{ secrets.BH_CI_PIPELINE_ALERTS }}
          notification-summary: |
            PR -- Failed to build or push Docker image: `${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}`
            [View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          notification-color: FF0000

      # Main Branch Build Success Notification
      - name: MS Teams Notification (Main Success)
        if: github.event_name == 'push' && success()
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ secrets.COMMON_GITHUB_TOKEN }}
          ms-teams-webhook-uri: ${{ secrets.BH_CI_PIPELINE_ALERTS }}
          notification-summary: |
            Main Branch -- Successfully built and pushed Docker image: `${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}`
            [View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          notification-color: 00FF00

      # Main Branch Build Failure Notification
      - name: MS Teams Notification (Main Failure)
        if: github.event_name == 'push' && failure()
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ secrets.COMMON_GITHUB_TOKEN }}
          ms-teams-webhook-uri: ${{ secrets.BH_CI_PIPELINE_ALERTS }}
          notification-summary: |
            Main Branch -- Failed to build or push Docker image: `${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}`
            [View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          notification-color: FF0000
