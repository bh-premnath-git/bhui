name: Main -- Build Docker Image and push to ECR

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  DEFAULT_IMAGE_TAG: "latest"
  IMAGE_NAME: bh-ui
  CURRENT_APP_VER: ${{ vars.APP_VER }}
  REPOSITORY: "058264070106.dkr.ecr.us-east-1.amazonaws.com"
  PR_GAR_URL: "058264070106.dkr.ecr.us-east-1.amazonaws.com"
  MAIN_GAR_URL: "058264070106.dkr.ecr.us-east-1.amazonaws.com"
  AWS_REGION: "us-east-1"

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | \
          docker login --username AWS --password-stdin "${REPOSITORY}"
      
      - name: Export AWS Credentials
        run: |
          echo "Exporting AWS credentials"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Configure npm for AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain bighammer \
            --domain-owner 058264070106 \
            --query authorizationToken \
            --output text)
    
          echo "registry=https://bighammer-058264070106.d.codeartifact.us-east-1.amazonaws.com/npm/bh-npm-repo/" > .npmrc
          echo "//bighammer-058264070106.d.codeartifact.us-east-1.amazonaws.com/npm/bh-npm-repo/:always-auth=true" >> .npmrc
          echo "//bighammer-058264070106.d.codeartifact.us-east-1.amazonaws.com/npm/bh-npm-repo/:_authToken=${TOKEN}" >> .npmrc
          echo "AWS CodeArtifact configured successfully"
          
      - name: Extract Branch Name
        run: |
          echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Set IMAGE_TAG for PR
        if: github.event_name == 'pull_request'
        run: |
          echo "IMAGE_TAG=${{ env.CURRENT_APP_VER }}-${{ github.run_number }}-PR.${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Build Docker Image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker build --no-cache -t "${PR_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Push Docker Image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker push "${PR_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Set IMAGE_TAG for Main Branch
        if: github.event_name == 'push'
        run: |
          echo "IMAGE_TAG=${{ env.CURRENT_APP_VER }}-${{ github.run_number }}-rc" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_ENV

      - name: Build Docker Image for Main Branch
        if: github.event_name == 'push'
        run: |
          docker build --no-cache \
            -t "${MAIN_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${MAIN_GAR_URL}/${IMAGE_NAME}:${DEFAULT_IMAGE_TAG}" \
            -t "${MAIN_GAR_URL}/${IMAGE_NAME}:${GIT_HASH}" .

      - name: Push Docker Image for Main Branch
        if: github.event_name == 'push'
        run: |
          docker push "${MAIN_GAR_URL}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${MAIN_GAR_URL}/${IMAGE_NAME}:${DEFAULT_IMAGE_TAG}"
          docker push "${MAIN_GAR_URL}/${IMAGE_NAME}:${GIT_HASH}"

      - name: Notify MSTeams - PR Image Build
        if: github.event_name == 'pull_request'
        run: |
          cat <<EOF > message.json
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Docker Image Build - 'bh-ui'",
            "themeColor": "0078D7",
            "title": "PR Docker Image ${IMAGE_NAME}:${IMAGE_TAG} pushed",
            "sections": [
              {
                "facts": [
                  {"name": "Repository", "value": "${GITHUB_REPOSITORY}"},
                  {"name": "Branch", "value": "${GITHUB_REF_NAME}"},
                  {"name": "Commit", "value": "${GITHUB_SHA}"}
                ]
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "View on GitHub",
                "targets": [{"os": "default", "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}]
              }
            ]
          }
          EOF
          curl -X POST "${{ secrets.BH_CI_Pipeline_Alerts }}" -H 'Content-Type: application/json' -d @message.json

      - name: Notify MSTeams - Main Image Build
        if: github.event_name == 'push'
        run: |
          cat <<EOF > message.json
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Docker Image Build - 'bh-ui'",
            "themeColor": "0078D7",
            "title": "Main Docker Image ${IMAGE_NAME}:${IMAGE_TAG} pushed",
            "sections": [
              {
                "facts": [
                  {"name": "Repository", "value": "${GITHUB_REPOSITORY}"},
                  {"name": "Branch", "value": "${GITHUB_REF_NAME}"},
                  {"name": "Commit", "value": "${GITHUB_SHA}"}
                ]
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "View on GitHub",
                "targets": [{"os": "default", "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}]
              }
            ]
          }
          EOF
          curl -X POST "${{ secrets.BH_CI_Pipeline_Alerts }}" -H 'Content-Type: application/json' -d @message.json
